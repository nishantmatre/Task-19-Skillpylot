<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Book Form</title><style>body{font-family:Arial;background:#f4f5fb;padding:35px}.card{max-width:550px;margin:auto;background:white;padding:28px;border-radius:12px}label{display:block;margin:18px 0 7px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:6px}.error{display:block;color:#c62828;margin-top:6px}button,a{display:inline-block;margin-top:22px;padding:11px 18px;border:0;border-radius:6px;text-decoration:none}button{background:#6254e7;color:white}a{background:#eee;color:#222}</style></head><body><div class="card"><h2>Book Details</h2><form th:object="${book}" th:action="${book.id == null}?@{/books}:@{/books/{id}(id=${book.id})}" method="post"><label>Book Title</label><input th:field="*{title}" placeholder="Enter book title"><span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span><label>Author Name</label><input th:field="*{author}" placeholder="Enter author name"><span class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span><button type="submit">Save Book</button><a th:href="@{/books}">Cancel</a></form></div></body></html>
